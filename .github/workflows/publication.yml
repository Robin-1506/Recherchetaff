# Publie le dossier docs/ sur GitHub Pages.
# Lancé après chaque collecte, et à chaque modification du site sur main.
name: Publication du site

on:
  push:
    branches: [main]
    # Le suivi et la copie d'Airtable sont lus directement via l'API GitHub :
    # inutile de republier le site à chaque modification.
    paths: ["docs/**", "!docs/data/suivi.chiffre.json", "!docs/data/airtable.chiffre.json"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      # « main » explicitement : après une collecte, on veut les données
      # tout juste enregistrées, pas la version du début du lancement.
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploiement
        uses: actions/deploy-pages@v4
