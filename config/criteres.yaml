    - Notion
    - Miro
    - Figma
    - Sketch
    - Axure
    - Balsamiq
    - Power BI
    - Tableau
    - SQL
    - Excel
    - SAP
    - Salesforce
    - ServiceNow
    - Google Analytics
  Savoir-faire:
    - recueil des besoins
    - expression des besoins
    - user stories
    - user story
    - backlog
    - priorisation
    - roadmap
    - spécifications fonctionnelles
    - cahier des charges
    - recette
    - tests utilisateurs
    - tests d'acceptation
    - ateliers
    - conduite du changement
    - pilotage
    - gestion de projet
    - budget
    - KPI
    - UX research
    - prototypage
    - wireframes
    - maquettes
    - accessibilité
    - RGAA
    - UML
    - BPMN
    - modélisation
    - API
  Certifications:
    - PSPO
    - CSPO
    - PSM
    - CSM
    - PMP
    - SAFe POPM
  Langues:
    - anglais
    - espagnol
    - allemand
    - italien

# =====================================================================
#  SCORE DE PERTINENCE (sur 100)
# ---------------------------------------------------------------------
#  score = points du poste cible + bonus mots-clés + lieu + contrat
#  Les mots sont cherchés sans tenir compte des majuscules ni des accents.
# =====================================================================
score:
  # Postes cibles, du plus prioritaire au moins prioritaire.
  # Une offre reçoit la catégorie du premier poste dont un intitulé apparaît
  # dans son titre (points complets). À défaut, si un intitulé apparaît
  # seulement dans la description, elle reçoit la catégorie avec des points
  # réduits (voir « part_si_description »).
  postes:
    - nom: Product Owner
      points: 50
      intitules:
        - product owner
        - proxy product owner
        - PO
        - PPO
        - responsable produit
    - nom: Chef de projet IT / digital
      points: 42
      intitules:
        - chef de projet digital
        - chef de projet informatique
        - chef de projet IT
        - chef de projet SI
        - chef de projet web
        - chef de projet numérique
        - chef de projet e-commerce
        - chef de projet applicatif
        - chef de projet fonctionnel
        - cheffe de projet
        - chef de projet
        - project manager
    - nom: Business Analyst / AMOA
      points: 38
      intitules:
        - business analyst
        - AMOA
        - MOA
        - assistance à maîtrise d'ouvrage
        - assistant maîtrise d'ouvrage
        - maîtrise d'ouvrage
        - consultant fonctionnel
        - analyste fonctionnel
        - functional analyst
    - nom: Product Manager
      points: 34
      intitules:
        - product manager
        - chef de produit digital
        - chef de produit web
        - chef de produit
    - nom: UX Researcher / Ergonome IHM
      points: 28
      intitules:
        - UX researcher
        - user researcher
        - ergonome IHM
        - ergonome logiciel
        - ergonome UX
        - ergonome
        - UX designer
        - UX/UI designer
        - UX UI designer
        - UX
  part_si_description: 0.4

  # Mots-clés valorisés (titre ou description) : points ajoutés pour chacun.
  mots_cles_bonus:
    recueil des besoins: 6
    expression des besoins: 5
    backlog: 5
    UX: 5
    ergonomie: 5
    user stories: 4
    user story: 4
    agile: 4
    scrum: 4
    tests utilisateurs: 4
    design thinking: 3
    MOA: 3
    AMOA: 3
    spécifications fonctionnelles: 3
    roadmap: 2
    JIRA: 2
  # Maximum de points apportés par les mots-clés bonus.
  plafond_bonus: 25

  # Points selon le lieu.
  lieu:
    zone: 15           # Nantes et alentours (rayon de la recherche)
    teletravail_complet: 10   # ailleurs en France, en télétravail complet
    teletravail_partiel: 3    # bonus pour le télétravail partiel (dans la zone)

  # Points selon le contrat. Les contrats non listés valent 0.
  contrats:
    CDI: 15
    CDD: 10
    Autre: 6
    Freelance: 3
    Intérim: 3

  # Expérience demandée : malus si l'offre en demande trop par rapport à toi.
  experience:
    mes_annees: 3        # ton expérience, en années
    ecart_tolere: 3      # malus au-delà de mes_annees + ecart_tolere (ici : plus de 6 ans)
    malus: 10
    malus_fort: 20       # au-delà de mes_annees + 2 × ecart_tolere (ici : plus de 9 ans)

  # Postes de direction (dans le titre) : malus.
  postes_direction:
    malus: 15
    intitules:
      - directeur
      - directrice
      - head of
      - VP
      - vice president
      - chief
      - CTO
      - CPO
      - CIO
      - DSI
      - directeur général

  # Fraîcheur : bonus pour une offre récente, malus pour une offre ancienne.
  fraicheur:
    recente_jours: 7
    bonus_recente: 5
    ancienne_jours: 45
    malus_ancienne: 5

  # Apprentissage : le score s'ajuste d'après tes ★ Intéressante, tes
  # candidatures et tes « Ignorer » (mots des intitulés et entreprises).
  apprentissage:
    actif: true
    choix_minimum: 5     # nombre de choix avant que l'apprentissage ne démarre
    points_max: 15       # ajustement maximum, en plus ou en moins

  # Offres « hors cible » : si l'une de ces expressions est dans le TITRE,
  # l'offre est déclassée (score divisé par 5) et classée hors cible.
  # Préfère des expressions précises à des mots seuls : « santé » écarterait
  # aussi un « Product Owner secteur santé ».
  exclusions_titre:
    - stage
    - stagiaire
    - alternance
    - alternant
    - apprenti
    - apprentissage
    - développeur
    - développeuse
    - developer
    - développement logiciel
    - full stack
    - fullstack
    - devops
    - data engineer
    - data scientist
    - ingénieur système
    - ingénieur réseau
    - technicien
    - commercial
    - commerciale
    - business developer
    - ingénieur d'affaires
    - account manager
    - vendeur
    - vendeuse
    # Ergonomie physique / santé au travail (et non ergonomie des logiciels)
    - santé au travail
    - santé et sécurité
    - santé sécurité
    - sécurité au travail
    - conditions de travail
    - prévention des risques
    - HSE
    - QSE
    - ergothérapeute
    # Chefs de projet hors informatique
    - chef de projet travaux
    - chef de projet BTP
    - chef de projet bâtiment
    - chef de projet génie civil
    - chef de projet industriel
    - chef de projet industrialisation
    - chef de projet événementiel
    - conducteur de travaux
  # Les offres de stage et d'alternance sont toujours hors cible.
  contrats_exclus:
    - Stage
    - Alternance

  # Indices d'une mission en ESN / cabinet de conseil (signalée, pas exclue).
  indices_esn:
    - ESN
    - SSII
    - pour l'un de nos clients
    - pour le compte de notre client
    - notre client
    - intercontrat
    - portage salarial
